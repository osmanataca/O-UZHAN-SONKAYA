name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Prepare APK Output
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/app-debug.apk build_output/KPSS_Ortaogretim.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KPSS-Ortaogretim-APK
          path: build_output/KPSS_Ortaogretim.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: KPSS Ortaöğretim v1.0.${{ github.run_number }}
          body: |
            ## 📱 KPSS Ortaöğretim Sınav Hazırlık Android APK
            
            GitHub Actions tarafından otomatik derlenmiştir.
            
            - **Paket Adı:** com.aistudio.kpss.ortaogretim.hzkp
            - **Çalışma Biçimi:** %100 Çevrimdışı (Offline)
            - **İçerik:** 106+ Soru, 120 Soruluk Deneme Sınavı, Çözümler, Yanlış Defteri, Analiz Paneli
            
            Aşağıdaki **Assets** bölümünden `KPSS_Ortaogretim.apk` dosyasını telefonunuza indirip kurabilirsiniz.
          files: build_output/KPSS_Ortaogretim.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
